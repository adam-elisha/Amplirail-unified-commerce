# Local development stack (simulator connector only; no provider keys, no real card data).
#   cp .env.example deploy/.env.local   then edit (see INSTALL.md, "Option A")
#   docker compose -f deploy/docker-compose.yml up --build
x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  env_file: .env.local
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  migrate:
    <<: *app
    command: ["sh", "-c", "php artisan migrate --database=pgsql_owner --force && php artisan db:seed --force"]
    restart: "no"
  app:
    <<: *app
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  relay:
    <<: *app
    command: ["php", "artisan", "amplirail:outbox:relay"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  db:
    image: postgres:16
    environment: { POSTGRES_DB: amplirail, POSTGRES_USER: postgres, POSTGRES_PASSWORD: local-only-superuser }
    volumes: ["./postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro"]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
