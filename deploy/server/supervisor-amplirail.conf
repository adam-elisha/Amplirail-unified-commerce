; AmpliRail background processes (single server). In AWS these are separate ECS services from the same image.
[group:amplirail]
programs=amplirail-worker,amplirail-relay,amplirail-scheduler

[program:amplirail-worker]
command=php __APP__/artisan queue:work redis --tries=3 --backoff=30 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=__APP__/storage/logs/worker.log
redirect_stderr=true

[program:amplirail-relay]
; Publishes committed outbox events and runs webhook fan-out. Exits hourly and is restarted fresh.
command=php __APP__/artisan amplirail:outbox:relay --max-seconds=3600
user=www-data
autostart=true
autorestart=true
stdout_logfile=__APP__/storage/logs/relay.log
redirect_stderr=true

[program:amplirail-scheduler]
; Webhook retries, partitions, weekly statements, pruning (routes/console.php).
command=php __APP__/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=__APP__/storage/logs/scheduler.log
redirect_stderr=true
