# AmpliRail nginx site (single server). TLS is added by certbot (see install-ubuntu.sh output).
server {
    listen 80;
    server_name __DOMAIN__;
    root __ROOT__;
    index index.php;

    client_max_body_size 12m;          # documents are limited to 10 MB in the app
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # Only public/ is served. Never expose dotfiles or storage.
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~* \.(css|js|svg|png|ico)$ { expires 7d; access_log off; }
}
