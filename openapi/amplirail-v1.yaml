openapi: 3.1.0
info:
  title: AmpliRail API
  version: 1.1.0
  description: >
    AmpliRail v1 API (launch slice + Sprint 0.5 activation engine). Source of truth for the HTTP contract; CI must fail on
    undocumented endpoints. Amounts are integer minor units with an ISO 4217 currency. Every POST requires an
    Idempotency-Key header (1-128 of A-Z a-z 0-9 - _ : .); keys are kept 24 hours; a replay returns the original response
    with header Idempotent-Replayed: true; the same key with a different body returns 409 idempotency_key_reused.
    Card numbers are never accepted anywhere: card data enters only through processor-hosted fields, which return a token.
    Supersedes packages/amplirail-core/openapi/launch-v1.yaml (all launch endpoints are kept; event names unchanged).
servers:
  - url: https://api.amplirail.com/v1
  - url: https://dev.amplirail.com/v1
security:
  - secretKey: []
tags:
  - { name: Payments }
  - { name: Payment links }
  - { name: Payout statements }
  - { name: Webhooks }
  - { name: Merchant self-service }
  - { name: Internal services, description: "CRM and RoboRiskAnalysis. OAuth2 client credentials only; merchant keys are refused." }
components:
  securitySchemes:
    secretKey: { type: http, scheme: bearer, description: "Merchant secret key arsec_sbx_... (sandbox) or arsec_live_... (live, issued at go-live)" }
    serviceToken:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: { crm.handoff: Hand off merchant applications, merchants.read: Read merchant status and the command center, risk.events: Post risk events }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_\\-:.]{1,128}$" } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: "next_cursor from the previous page" }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
  headers:
    Replayed: { description: true when this response is a stored idempotent replay, schema: { type: string, enum: ["true", "false"] } }
  schemas:
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, minimum: 1, example: 10000 }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: USD }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type: { type: string, enum: [invalid_request_error, authentication_error, permission_error, idempotency_error, rate_limit_error, api_error] }
            code: { type: string, example: over_refundable_amount }
            message: { type: string }
            decline_category: { type: string, nullable: true }
            request_id: { type: string, example: req_01j9zk... }
            details: { type: object, additionalProperties: true }
    List:
      type: object
      properties:
        object: { type: string, const: list }
        data: { type: array, items: {} }
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }
    Transaction:
      type: object
      properties:
        id: { type: string, example: txn_01j9zk3m8q }
        object: { type: string, const: transaction }
        environment: { type: string, enum: [sandbox, live] }
        kind: { type: string, enum: [sale, authorize] }
        status: { type: string, enum: [approved, declined, blocked, failed, unknown], description: "Outcome of the request. unknown = provider outcome unknown; reconciled, never blindly retried." }
        state: { type: string, enum: [captured, authorized, voided, partially_refunded, refunded, declined, blocked, failed, unknown] }
        amount_minor: { type: integer }
        currency: { type: string }
        captured_minor: { type: integer }
        refunded_minor: { type: integer }
        reason: { type: string, nullable: true }
        response_code: { type: string, nullable: true }
        decline_category: { type: string, nullable: true, enum: [insufficient_funds, do_not_honor, fraud_suspected, invalid_card, authentication_required, provider_unavailable, timeout, null] }
        order_reference: { type: string }
        card: { type: object, nullable: true, properties: { brand: { type: string }, last4: { type: string }, type: { type: string, enum: [credit, debit, prepaid] } } }
        merchant_account_id: { type: string, nullable: true }
        attempts: { type: integer, description: Number of routing attempts (present on create) }
        created_at: { type: string, format: date-time }
    Refund:
      type: object
      properties:
        id: { type: string, example: rf_01j9... }
        object: { type: string, const: refund }
        transaction_id: { type: string }
        status: { type: string, enum: [succeeded, failed] }
        amount_minor: { type: integer }
        currency: { type: string }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PaymentLink:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: payment_link }
        environment: { type: string }
        url: { type: string, example: "https://pay.amplirail.com/l/eyJt...sig" }
        amount_minor: { type: integer }
        currency: { type: string }
        reference: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [open, paid, cancelled] }
        transaction_id: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
    PayoutStatement:
      type: object
      properties:
        id: { type: string }
        merchant_account: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        currency: { type: string }
        status: { type: string, const: issued }
        fee_schedule_version: { type: string }
        gross_minor: { type: integer }
        fees_minor: { type: integer }
        reserve_minor: { type: integer }
        net_minor: { type: integer }
        chargeback_ratio_bps: { type: integer }
        lines: { type: array, items: { type: object, properties: { section: { type: string }, label: { type: string }, amount_minor: { type: integer } } } }
        issued_at: { type: string, format: date-time }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, example: whk_01j9... }
        url: { type: string }
        environment: { type: string }
        events: { type: array, items: { $ref: "#/components/schemas/EventType" } }
        status: { type: string, enum: [enabled, disabled] }
        secret: { type: string, description: "arwhk_... signing secret. Returned ONLY on create and rotate." }
    EventType:
      type: string
      enum: [transaction.approved, transaction.declined, transaction.blocked, transaction.failed, transaction.unknown, transaction.captured,
        transaction.voided, refund.succeeded, refund.failed, payout_statement.issued, merchant.live, webhook.test]
    WebhookPayload:
      description: >
        POSTed to your endpoint. Header AmpliRail-Signature: t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" with your arwhk_ secret>.
        Reject if the timestamp is more than 300 seconds old. Also sent: AmpliRail-Event-Id, AmpliRail-Delivery-Id.
        Failed deliveries retry with backoff for up to 72 hours, then the endpoint is disabled.
      type: object
      properties:
        id: { type: string, example: evt_01j9... }
        type: { $ref: "#/components/schemas/EventType" }
        environment: { type: string }
        occurred_at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    EventEnvelope:
      description: Internal event envelope (master document Section 11), returned by timelines.
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        version: { type: integer }
        occurred_at: { type: string, format: date-time }
        environment: { type: string }
        org_path: { type: string }
        actor: { type: object, properties: { type: { type: string }, id: { type: string } } }
        correlation_id: { type: string }
        policy_version: { type: string, nullable: true }
        subject: { type: object, properties: { type: { type: string }, id: { type: string } } }
        data: { type: object, additionalProperties: true }
    MerchantHandoff:
      description: Minimum application package (4-Day Activation design Section 3). Banking is a token reference only; raw account, routing or card fields are rejected.
      type: object
      required: [crm_deal_id, business, contacts, owners, primary_user, banking, commerce, agent]
      properties:
        crm_deal_id: { type: string, maxLength: 80, description: Immutable once stored }
        merchant_type: { type: string, enum: [standard, mobile, test], default: standard }
        business:
          type: object
          required: [legal_name, ein, entity_type, address]
          properties:
            legal_name: { type: string }
            dba: { type: string }
            ein: { type: string, pattern: "^\\d{2}-?\\d{7}$", description: Stored field-encrypted with a matching fingerprint }
            entity_type: { type: string, enum: [llc, corporation, s_corporation, partnership, sole_proprietorship, non_profit, other] }
            years_in_business: { type: integer }
            website: { type: string, format: uri }
            phone: { type: string }
            description: { type: string }
            timezone: { type: string }
            address: { type: object, required: [line1, city, region, postal_code, country], properties: { line1: { type: string }, line2: { type: string }, city: { type: string }, region: { type: string }, postal_code: { type: string }, country: { type: string, pattern: "^[A-Z]{2}$" } } }
        contacts: { type: array, minItems: 1, items: { type: object, required: [name, email], properties: { name: { type: string }, email: { type: string, format: email }, phone: { type: string }, role: { type: string } } } }
        owners: { type: array, minItems: 1, items: { type: object, required: [name, ownership_percent, identity_ref], properties: { name: { type: string }, ownership_percent: { type: integer, minimum: 0, maximum: 100 }, title: { type: string }, identity_ref: { type: string } } } }
        primary_user: { type: object, required: [name, email], properties: { name: { type: string }, email: { type: string, format: email } } }
        banking: { type: object, required: [settlement_token_ref], properties: { settlement_token_ref: { type: string }, last4: { type: string, pattern: "^\\d{4}$" } } }
        commerce:
          type: object
          required: [mcc, products, monthly_volume_minor, avg_ticket_minor, max_ticket_minor, currency, channels]
          properties:
            mcc: { type: string, pattern: "^\\d{4}$" }
            mcc_secondary: { type: string }
            products: { type: string }
            monthly_volume_minor: { type: integer }
            avg_ticket_minor: { type: integer }
            max_ticket_minor: { type: integer }
            currency: { type: string }
            channels: { type: array, items: { type: string, enum: [ecommerce, card_present, moto, virtual_terminal, payment_link, recurring, mobile, invoicing] } }
            cnp_percent: { type: integer }
            recurring: { type: boolean }
            refund_policy: { type: string }
            fulfillment: { type: string }
            chargeback_ratio_bps: { type: integer }
            prior_processor: { type: string }
        documents: { type: array, items: { type: object, properties: { document_type: { type: string }, reference: { type: string } } } }
        agent: { type: object, required: [agent_id, name], properties: { agent_id: { type: string }, name: { type: string }, iso: { type: string } }, description: Original agent, locked after creation }
        services: { type: array, items: { type: string } }
    Merchant:
      type: object
      properties:
        id: { type: string, example: mer_01j9... }
        object: { type: string, const: merchant }
        public_id: { type: string, example: EDP-M-00012871 }
        crm_deal_id: { type: string, nullable: true }
        legal_name: { type: string }
        state: { type: string, enum: [draft, submitted, kyb_pending, underwriting, approved, boarding, test_mode, validation, active, needs_info, manual_review, declined, suspended, closed] }
        sandbox: { type: object, properties: { merchant_account_id: { type: string }, test_mid: { type: string }, publishable_key: { type: string }, secret_key_hint: { type: string, description: "Masked. The secret is revealed once in the merchant portal." } } }
        checklist: { type: object, properties: { complete: { type: boolean }, outstanding: { type: array, items: { type: string } }, enabled: { type: boolean } } }
        replayed: { type: boolean }
        created_at: { type: string, format: date-time }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
paths:
  /oauth/token:
    post:
      tags: [Internal services]
      summary: OAuth2 client credentials token for internal services (15-minute bearer token)
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [grant_type], properties: { grant_type: { const: client_credentials }, client_id: { type: string }, client_secret: { type: string }, scope: { type: string, example: "crm.handoff merchants.read" } } }
      responses:
        "200": { description: Token, content: { application/json: { schema: { type: object, properties: { access_token: { type: string }, token_type: { const: Bearer }, expires_in: { type: integer }, scope: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /merchants/handoff:
    post:
      tags: [Internal services]
      summary: "AR-168: CRM handoff. Creates the canonical merchant at submitted and provisions the sandbox (simulator MID, arpub_sbx_/arsec_sbx_ keys, arwhk_sbx_ secret) in one transaction"
      description: Idempotent by Idempotency-Key AND by crm_deal_id (an existing deal returns 200 with the existing merchant). Feature flag crm_handoff.
      security: [ { serviceToken: [crm.handoff] } ]
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MerchantHandoff" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Merchant" } } } }
        "200": { description: Existing merchant for this crm_deal_id, content: { application/json: { schema: { $ref: "#/components/schemas/Merchant" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /merchants/{id}:
    get:
      tags: [Internal services]
      summary: Merchant status (service callers)
      security: [ { serviceToken: [merchants.read] } ]
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Merchant" } } } }, "404": { $ref: "#/components/responses/Error" } }
  /merchants/{id}/eligibility:
    get:
      tags: [Internal services]
      summary: "AR-170: latest processor eligibility result (ordered eligible routes and specific failing rules)"
      security: [ { serviceToken: [merchants.read] } ]
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses: { "200": { description: OK } }
  /merchants/{id}/documents:
    get:
      tags: [Internal services]
      summary: "AR-169: document checklist state (metadata only; files are downloaded only through audited, signed portal URLs)"
      security: [ { serviceToken: [merchants.read] } ]
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses: { "200": { description: OK } }
  /onboarding/command_center:
    get:
      tags: [Internal services]
      summary: "AR-173: read-only activation SLA aggregation (pipeline, per-merchant blockers, time in state, connector and webhook health)"
      security: [ { serviceToken: [merchants.read] } ]
      parameters: [ { name: sample, in: query, schema: { type: boolean }, description: Return the labelled demo fixture } ]
      responses: { "200": { description: OK } }
  /merchant:
    get:
      tags: [Merchant self-service]
      summary: The calling merchant, with its document checklist
      responses: { "200": { description: OK } }
  /merchant/documents:
    post:
      tags: [Merchant self-service]
      summary: Upload a KYB document (PDF, JPEG, PNG up to 10 MB; content-sniffed; stored encrypted under a random name)
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { content: { multipart/form-data: { schema: { type: object, required: [document_type, file], properties: { document_type: { type: string }, file: { type: string, format: binary } } } } } }
      responses: { "201": { description: Uploaded }, "422": { $ref: "#/components/responses/Error" } }
  /transactions:
    post:
      tags: [Payments]
      summary: Create a sale, or an authorization with capture=false
      description: >
        Routes only to the merchant's own active MIDs in the key's environment. Retryable provider errors fail over to the next
        MID; declines are never rerouted. Live keys only work after go-live. Sandbox simulator: token tok_sim_approved; amounts
        ending .02/.51/.59/.65 decline, .99 times out; field simulator = sim_timeout | sim_outage | sim_avs_fail.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payment_token, order_reference]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
                payment_token: { type: string, description: Token from processor-hosted fields. Never a card number. }
                order_reference: { type: string }
                capture: { type: boolean, default: true }
                initiator: { type: string, enum: [customer, merchant], default: customer }
                card: { type: object, properties: { brand: { type: string }, last4: { type: string }, type: { type: string } } }
                simulator: { type: string, enum: [sim_timeout, sim_outage, sim_avs_fail], description: Sandbox only }
      responses:
        "201": { description: Created (check status), headers: { Idempotent-Replayed: { $ref: "#/components/headers/Replayed" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [Payments]
      summary: List transactions (key's environment)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/List" } } } } }
  /transactions/{id}:
    get:
      tags: [Payments]
      summary: Get a transaction
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }, "404": { $ref: "#/components/responses/Error" } }
  /transactions/{id}/timeline:
    get:
      tags: [Payments]
      summary: Transaction with its event timeline and ledger postings
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { transaction: { $ref: "#/components/schemas/Transaction" }, events: { type: array, items: { $ref: "#/components/schemas/EventEnvelope" } }, ledger: { type: array, items: { type: object } } } } } }
  /transactions/{id}/capture:
    post:
      tags: [Payments]
      summary: Capture an authorization (all or part)
      parameters: [ { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { amount: { $ref: "#/components/schemas/Money" } } } } } }
      responses: { "200": { description: Captured }, "409": { $ref: "#/components/responses/Error" } }
  /transactions/{id}/void:
    post:
      tags: [Payments]
      summary: Void an authorization or an unrefunded capture
      parameters: [ { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses: { "200": { description: Voided }, "409": { $ref: "#/components/responses/Error" } }
  /refunds:
    post:
      tags: [Payments]
      summary: Refund all or part of a captured transaction
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [transaction_id, amount], properties: { transaction_id: { type: string }, amount: { $ref: "#/components/schemas/Money" }, reason: { type: string } } } } }
      responses:
        "201": { description: Refunded, content: { application/json: { schema: { $ref: "#/components/schemas/Refund" } } } }
        "402": { description: Provider refused the refund, content: { application/json: { schema: { $ref: "#/components/schemas/Refund" } } } }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [Payments]
      summary: List refunds
      parameters: [ { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" } ]
      responses: { "200": { description: OK } }
  /refunds/{id}:
    get: { tags: [Payments], summary: Get a refund, parameters: [ { $ref: "#/components/parameters/Id" } ], responses: { "200": { description: OK } } }
  /payment_links:
    post:
      tags: [Payment links]
      summary: Create a signed payment or invoice link (amount, currency, merchant and expiry are signed)
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content: { application/json: { schema: { type: object, required: [amount, reference], properties: { amount: { $ref: "#/components/schemas/Money" }, reference: { type: string }, description: { type: string }, expires_in_hours: { type: integer, default: 72, maximum: 2160 }, send_to: { type: object, properties: { email: { type: string }, phone: { type: string } } } } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentLink" } } } } }
    get:
      tags: [Payment links]
      summary: List payment links
      parameters: [ { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" } ]
      responses: { "200": { description: OK } }
  /payout_statements:
    get:
      tags: [Payout statements]
      summary: List issued payout statements
      parameters: [ { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" } ]
      responses: { "200": { description: OK } }
  /payout_statements/{id}:
    get:
      tags: [Payout statements]
      summary: Get an issued statement (format=json|csv|pdf|xlsx)
      parameters: [ { $ref: "#/components/parameters/Id" }, { name: format, in: query, schema: { type: string, enum: [json, csv, pdf, xlsx], default: json } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PayoutStatement" } } } } }
  /webhook_endpoints:
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint (HTTPS, public address); the signing secret is returned once
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [url, events], properties: { url: { type: string }, events: { type: array, items: { $ref: "#/components/schemas/EventType" } } } } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEndpoint" } } } } }
      callbacks:
        event:
          "{$request.body#/url}":
            post:
              requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookPayload" } } } }
              responses: { "200": { description: Any 2xx acknowledges the delivery } }
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      responses: { "200": { description: OK } }
  /webhook_endpoints/{id}/rotate_secret:
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret (new secret returned once)
      parameters: [ { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses: { "200": { description: Rotated } }
  /webhook_endpoints/{id}/test:
    post:
      tags: [Webhooks]
      summary: Send a webhook.test event (validates delivery for the go-live gate)
      parameters: [ { $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses: { "202": { description: Queued } }
x-admin-console-actions:
  description: >
    Human-only operations (dual control, step-up) are NOT exposed to API keys or service tokens. They are session-authenticated
    admin console actions with CSRF protection: request go-live (POST /admin/merchants/{id}/go-live), approve or reject
    (POST /admin/approvals/{id}/approve|reject with step_up_code and note), emergency override
    (POST /admin/merchants/{id}/go-live-override, Platform Owner only), risk decision (POST /admin/merchants/{id}/risk/decide).
