# Local development only. Uses the simulator connector; no provider keys needed.
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: .env.local
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: .env.local
    command: ["php", "artisan", "queue:work", "--tries=3"]
    depends_on: [db, redis]
  db:
    image: postgres:16
    environment: { POSTGRES_DB: amplirail, POSTGRES_USER: amplirail, POSTGRES_PASSWORD: local-only-password }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
