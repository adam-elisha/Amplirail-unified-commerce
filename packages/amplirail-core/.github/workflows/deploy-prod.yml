name: deploy-prod
on:
  release:
    types: [published]
permissions:
  id-token: write
  contents: read
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # requires approval from Adam and Mohit (GitHub environment rule)
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: us-east-1 }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push release image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/amplirail:${{ github.event.release.tag_name }}
          docker build -f deploy/Dockerfile -t $IMAGE .
          docker push $IMAGE
      - name: Run migrations
        run: aws ecs run-task --cluster amplirail-prod --task-definition amplirail-migrate --launch-type FARGATE --network-configuration "${{ vars.ECS_NETWORK_CONFIG }}" --overrides '{"containerOverrides":[{"name":"app","command":["php","artisan","migrate","--force"]}]}'
      - name: Deploy with automatic rollback
        run: |
          aws ecs update-service --cluster amplirail-prod --service api --force-new-deployment --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}"
          aws ecs update-service --cluster amplirail-prod --service worker --force-new-deployment --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}"
          aws ecs wait services-stable --cluster amplirail-prod --services api worker
      - name: Smoke tests
        run: |
          curl -fsS https://api.amplirail.com/health
          curl -fsS -o /dev/null https://app.amplirail.com
          curl -fsS -o /dev/null https://pay.amplirail.com
